<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>AI Copilot Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Phân tích Hành vi & Tập trung (Active Focus Time)</h1>
      <p>Thống kê thời gian và nhịp độ làm việc trên các trang web (Phase 1).</p>
    </header>
    <main>
      <div class="card" style="margin-bottom: 24px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2>🧠 Daily AI Copilot Insights</h2>
          <button id="btnGenerateRecap" class="btn-dashboard">Tiến hành Phân Tích Ngày</button>
        </div>
        <div id="recap-container" class="insight-box">
          <div style="text-align:center; color:#666; font-size:13px; padding:20px;">
            Hệ thống chưa tạo báo cáo phân tích nào cho hôm nay. Bấm nút phía trên để AI tổng hợp nhé!
          </div>
        </div>
      </div>

      <div class="card">
        <h2>⏱️ Thời gian tập trung theo Website</h2>
        <div id="chart-container">
           <!-- Chart rendered by JS -->
        </div>
      </div>
    </main>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
